# =====================================================================
# Archivo: deploy/apache-vhost.conf
# Descripción: Sitio de Apache en el servidor de AWS Lightsail (Bitnami).
#   Se copia a /opt/bitnami/apache/conf/vhosts/calculadora-vhost.conf
#   (lo hace deploy/update.sh). La app vive en /opt/bitnami/projects/calculadora.
# =====================================================================

<VirtualHost 127.0.0.1:80 _default_:80>
  ServerAlias *
  DocumentRoot /opt/bitnami/projects/calculadora

  <Directory "/opt/bitnami/projects/calculadora">
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
  </Directory>

  # Archivos internos que no se publican: repositorio git, scripts de
  # despliegue, documentación, archivos ocultos y los PHP que solo se
  # incluyen desde otros (configuración con contraseñas, base común).
  <DirectoryMatch "/(\.git|deploy)(/|$)">
    Require all denied
  </DirectoryMatch>
  <FilesMatch "(^\.|\.(md|sql|sh|conf)$|^(config|config\.local|db|structure)\.php$|^default-templates\.json$)">
    Require all denied
  </FilesMatch>
</VirtualHost>
